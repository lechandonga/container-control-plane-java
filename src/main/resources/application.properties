server.port=8080

# ===== 单机模拟控制面参数 =====
# 控制循环调谐间隔（毫秒）：level-triggered 全量调谐
controlplane.reconcile-interval-ms=100
# 模拟节点心跳间隔（毫秒）
controlplane.heartbeat-interval-ms=50
# 心跳超时（秒）：超时即判定节点失联并 fence
controlplane.heartbeat-timeout-seconds=8
# 本地权威状态快照目录：期望状态 / 发布历史 / 进行中进度的持久化位置（无外部依赖）
controlplane.state-dir=.controlplane-state
